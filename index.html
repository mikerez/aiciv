    <script>
        // very global vars
//        var _redraw = 1;
        var _fulldraw = 1;
        var sqrt2 = Math.sqrt(2);

        // we dont use class members to do not always write "this." since we use only one object of any type
        const _map_size = 100;
        var _world_map_size = 100;
        var _map_origin_i = 0;
        var _map_origin_j = 0;
        const _cell_width = 200;  // by X, already multiplied by sqrt2/2
        const _cell_height = 200;  // by Y, already multiplied by sqrt2/2
        const _map_view = [_map_size/2*_cell_width,-_map_size/2*_cell_height,
                           _map_size/2*3*_cell_width,_map_size/2*_cell_height];
        let _map_terrain_tex = new Array(_map_size);
        var _map_terrain_bit = new Array(_map_size);
        let _map_resource = new Array(_map_size);
        let _map_terrain_mod = new Array(_map_size);
        // not zoomed coordinates from start of the map
        function xytoi(x,y) { return (x+y)/2/*sqrt2^2*//_cell_height; }
        function xytoj(x,y) { return (x-y)/2/*sqrt2^2*//_cell_width; }  //_map_size*sqrt2/2-
        function ijtox(i,j) { return i*_cell_height+j*_cell_width; }
        function ijtoy(i,j) { return i*_cell_height-j*_cell_width; }
    </script>

    <script>
        // X,Y - canvas backing-buffer coordinates.
        function Xtox1(X) { return X*2-_canvas.width/*/2*2*/; }
        function Ytoy1(Y) { return Y*2-_canvas.height/*/2*2*/; }
        function x1toX(x) { return (x+_canvas.width)/2/*/2*2*/; }
        function y1toY(y) { return (y+_canvas.height)/2/*/2*2*/; }
        function eventToCanvas(event) {
            const rect = _canvas.getBoundingClientRect();
            return {
                x: (event.clientX - rect.left) * _canvas.width / rect.width,
                y: (event.clientY - rect.top) * _canvas.height / rect.height,
            };
        }
        function eventToMapCoord(event) {
            const point = eventToCanvas(event);
            return new Coord(xy1toi(Xtox1(point.x), Ytoy1(point.y)), xy1toj(Xtox1(point.x), Ytoy1(point.y)));
        }

        var _canvas = document.getElementById("canvas3D");
        var _gl = _canvas.getContext("webgl", { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: "low-power", preserveDrawingBuffer: true });
        const _ratio = window.devicePixelRatio;
        var _screenZoom = 2;
        var _screenOffsetX = _map_view[0]/_screenZoom+_canvas.width*2;
        var _screenOffsetY = _map_view[1]/_screenZoom-_canvas.height*2;

                cancelGamePointerForPinch();
                return;
            }
            if (!_mousedown && !isGameInputTarget(event.target)) {
                return;
            }
            const input = primaryInput(event);
            const point = eventToCanvas(input);
            const coord = eventToMapCoord(input);
            _last_hover_coord = coord;
            if (_phone_touch_context) {
                var phoneMoveRect = _canvas.getBoundingClientRect();
                var phoneMoveThreshold = 12*_canvas.width/Math.max(1, phoneMoveRect.width);
                var phoneMoveDx = point.x - _phone_touch_context.x;
                var phoneMoveDy = point.y - _phone_touch_context.y;
                if (phoneMoveDx*phoneMoveDx + phoneMoveDy*phoneMoveDy
                    >= phoneMoveThreshold*phoneMoveThreshold) {
                    _phone_touch_context.moved = true;
                }
            }
            if (_pending_ground_tap) {
                var groundTapRect = _canvas.getBoundingClientRect();
                var groundTapThreshold = 12*_canvas.width/Math.max(1, groundTapRect.width);
                var groundTapDx = point.x - _pending_ground_tap.x;
                var groundTapDy = point.y - _pending_ground_tap.y;
                if (groundTapDx*groundTapDx + groundTapDy*groundTapDy
                    >= groundTapThreshold*groundTapThreshold) {
                    _pending_ground_tap.moved = true;
                }
            }
            if (_pending_phone_map_command_tap) {
                var commandCanvasRect = _canvas.getBoundingClientRect();
                var commandDragThreshold = 12*_canvas.width/Math.max(1, commandCanvasRect.width);
                var commandDx = point.x - _pending_phone_map_command_tap.x;
                var commandDy = point.y - _pending_phone_map_command_tap.y;
                if (commandDx*commandDx + commandDy*commandDy >= commandDragThreshold*commandDragThreshold) {
                    _pending_phone_map_command_tap.moved = true;
                }
                else {
                    _pending_phone_map_command_tap.coord = coord;
                }
                event.preventDefault();
                return;
            }
            if (typeof _unit_stack_menu !== 'undefined' && _unit_stack_menu.updateDeferredPhoneTap) {
                var canvasRect = _canvas.getBoundingClientRect();
                var dragThreshold = 12*_canvas.width/Math.max(1, canvasRect.width);
                _unit_stack_menu.updateDeferredPhoneTap(point, dragThreshold);
                if (_pending_phone_action_tap) {
                    var actionDx = point.x - _pending_phone_action_tap.x;
                    var actionDy = point.y - _pending_phone_action_tap.y;
                    if (actionDx*actionDx + actionDy*actionDy >= dragThreshold*dragThreshold) {
                        _pending_phone_action_tap.moved = true;
                    }
                }
            }
            if (_current_game.previewMapCommand(coord)) {
                event.preventDefault();
                return;
            }
            if (!_mousedown && !(event.touches && event.touches.length)) {
                return;
            }
            event.preventDefault();
            if (_dragging_unit_path && _selection != -1 && _units[_selection].can_move) {
                _dragging_unit_path_moved = 1;
                if (_current_game.prepareManualMovement) {
                    _current_game.prepareManualMovement(_selection);
                }
                _current_game.drawCommandPathPreview(coord);
                if (_current_game.commitCommandPath) {
                    _current_game.commitCommandPath(coord);
                }
                if (_current_game.dismissActionMenu) {
                    _current_game.dismissActionMenu();
                }
                return;
            }
            if (_panning_map) {
                panMapToPoint(point);
            }
        }

        function handlePointerUp(event) {
            if (useMapPinch(event)) return;
            if (!_mousedown && !isGameInputTarget(event.target)) {
                return;
            }
            event.preventDefault();
            if (_suppress_phone_touch_end && event.type === 'touchend') {
                _suppress_phone_touch_end = false;
                _phone_touch_context = null;
                return;
            }
            var phoneTouchContext = _phone_touch_context;
            _phone_touch_context = null;
            var groundTap = _pending_ground_tap;
            _pending_ground_tap = null;
            var mapCommandTap = _pending_phone_map_command_tap;
            _pending_phone_map_command_tap = null;
            if (mapCommandTap) {
                if (event.type === 'touchend' && !mapCommandTap.moved) {
                    var commandInput = primaryInput(event);
                    var commandCoord = commandInput ? eventToMapCoord(commandInput) : mapCommandTap.coord;
                    if (_current_game.handleMapClick(commandCoord)) {
                        _current_game.applyMenuRules();
                    }
                }
                _mousedown = 0;
                _dragging_unit_path = 0;
                _panning_map = 0;
                _last_pointer_point = null;
                _fulldraw = 1;
                drawScene(0);
                return;
            }
            if (typeof _unit_stack_menu !== 'undefined' && _unit_stack_menu.finishDeferredPhoneTap) {
                _unit_stack_menu.finishDeferredPhoneTap(event.type === 'touchend');
            }
            var actionTap = _pending_phone_action_tap;
            _pending_phone_action_tap = null;
            if (actionTap && event.type === 'touchend' && !actionTap.moved
                && Date.now() - actionTap.startedAt <= 500
                && _current_game.showActionMenuForSelection) {
                _current_game.showActionMenuForSelection();
            }
            if (_dragging_unit_path && _dragging_unit_path_moved
                && _selection != -1 && _units[_selection] && _units[_selection].gotoCoord
                && _current_game.configureSelectedMovementIntent) {
                _current_game.configureSelectedMovementIntent(_units[_selection].gotoCoord);
            }
            _mousedown = 0;
            _dragging_unit_path = 0;
            _dragging_unit_path_moved = 0;
            _panning_map = 0;
            _last_pointer_point = null;
            if (event.type === 'touchend' && phoneTouchContext && !phoneTouchContext.moved) {
                _last_phone_tap = {
                    time: Date.now(),
                    x: phoneTouchContext.x,
                    y: phoneTouchContext.y,
                    selection: phoneTouchContext.selection,
                    multiSelection: phoneTouchContext.multiSelection
                };
            }
            if (groundTap && !groundTap.moved && event.type !== 'touchcancel') {
                clearGameSelection();
            }
        }

        window.onmousedown = handlePointerDown;
        window.onmousemove = handlePointerMove;
        window.onmouseup = handlePointerUp;
        window.oncontextmenu = function(event) {
            if (isGameInputTarget(event.target)) {
                event.preventDefault();
            }
        };
        window.addEventListener('touchstart', handlePointerDown, { passive: false });
        window.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp, { passive: false });
        window.addEventListener('touchcancel', handlePointerUp, { passive: false });

        document.body.onkeydown = function(event) {
            if (event.shiftKey) {
                _shift_pressed = 1;
            }
            else {
                _shift_pressed = 0;
            }
            if (event.ctrlKey) {
                _ctrl_pressed = 1;
            }
            else {
                _ctrl_pressed = 0;
            }
            if (event.code === 'Escape') {
                if (document.getElementById('optionsMenu').style.display == 'block') {
                    setOptionsMenuVisible(false);
                    return;
                }
                _last_phone_tap = null;
                _pending_ground_tap = null;
                clearGameSelection();
                return;
            }
            if (event.code === 'Enter') {
                event.preventDefault();
                endTurn();
                return;
            }
            if (event.code === 'KeyG') {
                _current_game.doCommand('goto');
                if (_current_game.dismissActionMenu) _current_game.dismissActionMenu();
                _fulldraw = 1;
                drawScene(0);
                return;
            }
            if (event.code === 'KeyB') {
                _current_game.doCommand('build_city');
                if (_current_game.dismissActionMenu) _current_game.dismissActionMenu();
                _fulldraw = 1;
                drawScene(0);
            }
        };

        document.body.onkeyup = function(event) {
            if (event.shiftKey) {
                _shift_pressed = 1;
            }
            else {
                _shift_pressed = 0;
            }
            if (event.ctrlKey) {
                _ctrl_pressed = 1;
            }
            else {
                _ctrl_pressed = 0;
            }

        };

        window.onscroll = function(event) {
//            _redraw = 1;
//           setTimeout(drawScene, 100);
        }

        function checkScrollTimeout(X, Y)
        {
            if (_screenOffsetX == X && _screenOffsetY == Y) {
                _scroll_step = 4;
            }
        }

        var _scroll_step = 4;
        document.addEventListener("wheel", (event) => {
          event.preventDefault();
          event.stopPropagation();

          if (event.ctrlKey || _ctrl_pressed) {
              var zoomAnchor = eventToCanvas(event);
              var zoomMapCoord = eventToMapCoord(event);
              setMapZoomAtPoint(
                  _screenZoom + (event.deltaY > 0 ? 0.2 : -0.2),
                  zoomAnchor,
                  zoomMapCoord
              );
              return;
          }

          _draw.clear();

          for (var k=0; k<_scroll_step; ++k) {
              if (!_shift_pressed) {
                  _screenOffsetY -= event.deltaY>0?-_screenZoom/5:_screenZoom/5;
              }
              else {
                  _screenOffsetX -= event.deltaY>0?-_screenZoom/5:_screenZoom/5;
              }
              _fulldraw = 1;
//              _redraw = 1;
              if (!_in_drawing) {
                  setTimeout(drawScene, 0, 0);
              }
          }
                  setTimeout(drawScene, 0, 0);

//drawScene(0);
          _scroll_step = _scroll_step>128?_scroll_step:_scroll_step*2;
          setTimeout(checkScrollTimeout, 500, _screenOffsetX, _screenOffsetY);
          // now define custom functionality
        }, { passive: false });

    </script>
</body>
