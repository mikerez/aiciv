<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-vocabulary="app.register_title">Register AI Civilization Player</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #18211b; color: #172018; font: 15px Arial, sans-serif; }
        main { width: min(420px, calc(100vw - 32px)); background: rgba(255,255,255,.94); border: 1px solid rgba(0,0,0,.35); border-radius: 8px; padding: 28px; }
        h1 { margin: 0 0 22px; font-size: 24px; letter-spacing: 0; }
        label { display: block; margin: 14px 0 6px; font-weight: bold; }
        input { width: 100%; min-height: 42px; padding: 9px 10px; border: 1px solid #788279; border-radius: 4px; font: inherit; }
        button { width: 100%; min-height: 44px; margin-top: 20px; border: 1px solid #1d4629; border-radius: 4px; background: #28643a; color: white; font: bold 15px Arial, sans-serif; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #message { min-height: 20px; margin: 14px 0 0; color: #9b1c1c; }
        nav { margin-top: 14px; text-align: center; }
        a { color: #1c5630; }
    </style>
</head>
<body>
<main>
    <h1 data-vocabulary="auth.register_heading">Register Player</h1>
    <form id="registerForm">
        <label for="login" data-vocabulary="auth.login">Login</label>
        <input id="login" name="login" autocomplete="username" minlength="3" maxlength="50" required>
        <label for="email" data-vocabulary="auth.email_optional">Email (optional)</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254">
        <label for="password" data-vocabulary="auth.password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <button id="submitButton" type="submit" data-vocabulary="auth.register">Register</button>
        <p id="message" role="alert"></p>
    </form>
    <nav><a href="login.html" data-vocabulary="auth.return_login">Return to login</a></nav>
</main>
<script src="vocabulary_EN.js?v=20260812b"></script>
<script src="vocabulary_FR.js?v=20260812b"></script>
<script src="vocabulary_DE.js?v=20260812b"></script>
<script src="vocabulary_SP.js?v=20260812b"></script>
<script src="vocabulary_RU.js?v=20260812b"></script>
<script src="vocabulary_IT.js?v=20260812b"></script>
<script src="vocabulary_CH.js?v=20260812b"></script>
<script src="vocabulary_JP.js?v=20260812b"></script>
<script src="vocabulary.js?v=20260816a"></script>
<script src="register.js?v=20260816a"></script>
</body>
</html>
